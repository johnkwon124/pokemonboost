name: Reservation monitor

# Manual only. OpenTable tarpits every request from GitHub's IP ranges -- a
# diagnose run showed even robots.txt hanging for the full timeout while
# example.com answered in 0.0s from the same runner -- so a scheduled job here
# could only ever fail. The monitor runs from a machine on a home connection
# instead; see docs/RESERVATION_MONITOR.md.
#
# This is kept so `diagnose` can be re-run from here later: if OpenTable ever
# stops blocking datacenter traffic, the cron can come back.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options:
          - check      # normal scan; e-mails anything new
          - probe      # print every seating found, send nothing
          - diagnose   # report how the booking host responds to us

# Never let two scans overlap; a queued one is dropped rather than doubled up.
concurrency:
  group: reservation-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-monitor.txt

      # The runner is thrown away after every run, so the "already e-mailed
      # you about this slot" record rides along in the cache. Keys rotate
      # because a cache entry cannot be overwritten once written.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Check availability
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          RESY_API_KEY: ${{ secrets.RESY_API_KEY }}
          RESY_AUTH_TOKEN: ${{ secrets.RESY_AUTH_TOKEN }}
          OPENTABLE_AUTH_TOKEN: ${{ secrets.OPENTABLE_AUTH_TOKEN }}
          OPENTABLE_COOKIE: ${{ secrets.OPENTABLE_COOKIE }}
        run: python -m reservation_monitor "${{ inputs.mode || 'check' }}"

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
