name: Reservation monitor

# Watches the restaurant's booking platform for the seatings in
# config/reservation.yaml and e-mails when one opens up. Cancellations get
# re-booked within minutes, so this polls often.
on:
  schedule:
    # Every 10 minutes, deliberately off the :00 mark where every scheduled
    # job on GitHub piles up. Times are UTC; GitHub treats these as best
    # effort and will skip runs when the shared queue is busy.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Print every seating found instead of e-mailing"
        type: boolean
        default: false

# Never let two scans overlap; a queued one is dropped rather than doubled up.
concurrency:
  group: reservation-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-monitor.txt

      # The runner is thrown away after every run, so the "already e-mailed
      # you about this slot" record rides along in the cache. Keys rotate
      # because a cache entry cannot be overwritten once written.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Check availability
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          RESY_API_KEY: ${{ secrets.RESY_API_KEY }}
          RESY_AUTH_TOKEN: ${{ secrets.RESY_AUTH_TOKEN }}
          OPENTABLE_AUTH_TOKEN: ${{ secrets.OPENTABLE_AUTH_TOKEN }}
          OPENTABLE_COOKIE: ${{ secrets.OPENTABLE_COOKIE }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python -m reservation_monitor probe
          else
            python -m reservation_monitor check
          fi

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-${{ github.run_id }}
